<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f3e9">
  <title>ジャストワン</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="stylesheet" href="styles.css?v=0.15">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="brand">ジャストワン</div>
        <div class="sub">ONLINE v0.15</div>
      </div>
      <div class="topActions">
        <button id="topicListButton" class="topbarBtn topicTopBtn" type="button">お題リスト</button>
        <div id="roomTopControls" class="roomTopControls"></div>
        <span id="netBadge" class="netBadge offline">未接続</span>
      </div>
    </header>
    <main id="screen"></main>
  </div>


  <div id="topicModal" class="topicModal" aria-hidden="true">
    <div class="topicDialog" role="dialog" aria-modal="true" aria-labelledby="topicDialogTitle">
      <div class="topicDialogHead">
        <div>
          <div id="topicDialogTitle" class="topicDialogTitle">お題リスト</div>
          <div id="topicCount" class="topicCount">読み込み中...</div>
        </div>
        <button id="topicClose" class="topicClose" type="button" aria-label="閉じる">×</button>
      </div>
      <div id="topicEditor" class="topicEditor">
        <input id="topicAddInput" class="input" maxlength="30" placeholder="追加するお題">
        <button id="topicAddButton" class="btn primary" type="button">追加</button>
      </div>
      <div id="topicPermission" class="topicPermission">追加・削除した内容は全ROOM共通で保存され、次に開始するゲームから反映されます。</div>
      <input id="topicSearch" class="input topicSearch" maxlength="30" placeholder="お題を検索">
      <div id="topicList" class="topicList"><div class="muted">読み込み中...</div></div>
    </div>
  </div>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="app.js?v=0.15"></script>
</body>
</html>
